<!-- 余额与余量：蓝底圆角瓦片 + 白色钱包与硬币（示意余额/余量）。图标源文件；
     市场引用的位图由它渲染（docs/icon.png，1024×1024）。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0" stop-color="#4aa4ff"/><stop offset="1" stop-color="#1f66e0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>

  <!-- 钱包本体 + 暗扣 -->
  <rect x="88" y="208" width="336" height="192" rx="52" fill="#ffffff"/>
  <circle cx="356" cy="304" r="26" fill="url(#tile)"/>

  <!-- 硬币叠在钱包右上角 -->
  <circle cx="370" cy="178" r="76" fill="#ffffff" stroke="url(#tile)" stroke-width="16"/>
  <circle cx="370" cy="178" r="38" fill="none" stroke="url(#tile)" stroke-width="18"/>

  <rect width="512" height="512" rx="116" fill="url(#gloss)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="4"/>
</svg>
